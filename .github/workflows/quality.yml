name: Quality

on:
  push:
  pull_request:

jobs:
  authored-file-limits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce 350-line limit
        run: python scripts/check_line_limits.py
